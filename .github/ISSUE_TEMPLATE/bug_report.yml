name: Bug report
description: Something in MHGU Recomp doesn't work as it should.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Mods can sometimes cause problems that look like recomp bugs, so it helps to say whether you were using any.
        If a mod looks like the cause, you're welcome to also share it in the [mod directory](https://github.com/Oddity-git/MHGURecomp-mods/issues/new?template=report-mod-issue.yml), which keeps track of mod issues. That's entirely optional, and you can report it here either way.
  - type: dropdown
    id: mods
    attributes:
      label: Were any mods installed?
      description: Moving your `mods` folder away and trying again is the quickest way to find out.
      options:
        - "No, it happens with no mods installed"
        - "Yes, it only happens with mods installed"
        - "Not sure / haven't tried without mods"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What goes wrong?
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: MHGU Recomp version
      placeholder: "0.10.7"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - Steam Deck
        - macOS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Paste the relevant part of `log.txt` from the `run` folder.
      render: shell
    validations:
      required: false
